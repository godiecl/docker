---
#  docker run -it --name grav --rm -p 8000:8000 -v ./config:/config registry.liguana.cl/grav:2.0.26
name: grav

services:
  grav:
    image: registry.liguana.cl/grav:2.0.26
    container_name: grav
    hostname: grav
    expose:
      - 8000
    volumes:
      - ./config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fS", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  default:
    name: npm
    external: true
