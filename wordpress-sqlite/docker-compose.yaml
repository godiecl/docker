---
#  docker run -it --name wp-sqlite --rm -p 8000:8000 -v /tmp:/tmp registry.liguana.cl/wp-sqlite:7.1
name: wordpress

services:
  wordpress-sqlite:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.liguana.cl/wp-sqlite:7.1
    container_name: wordpress
    hostname: wordpress
    expose:
      - 8000
    volumes:
      - ./wp-content/database:/app/wp-content/database
      - ./wp-content/uploads:/app/wp-content/uploads
      - ./wp-content/plugins:/app/wp-content/plugins
      - ./wp-content/themes:/app/wp-content/themes
      - ./wordpress/wp-config.php:/app/wp-config.php:ro
    restart: unless-stopped

networks:
  default:
    name: npm
    external: true
